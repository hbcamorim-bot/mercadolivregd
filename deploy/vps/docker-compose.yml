name: mercadolivregd

services:
  postgres:
    image: postgres:16-alpine
    container_name: mercadolivregd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - internal

  migrate:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: migrator
    container_name: mercadolivregd-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - internal

  app:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: mercadolivregd-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
      NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "127.0.0.1:3016:3000"
    volumes:
      - /opt/mercadolivregd/uploads:/app/.data/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then((r) =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n-zmdc_default
      - traefik.http.routers.mercadolivregd.entrypoints=websecure
      - traefik.http.routers.mercadolivregd.rule=Host(`mercadolivregd.187-127-45-24.sslip.io`)
      - traefik.http.routers.mercadolivregd.tls.certresolver=letsencrypt
      - traefik.http.services.mercadolivregd.loadbalancer.server.port=3000
    networks:
      - internal
      - proxy

volumes:
  pgdata:
    name: mercadolivregd_pgdata

networks:
  internal:
    name: mercadolivregd_internal
  proxy:
    external: true
    name: n8n-zmdc_default
